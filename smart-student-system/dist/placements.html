<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placements | Innosphere Smart System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #42c6ff;
            --accent2: #8b5cf6;
            --bg: #070b1b;
            --surface: rgba(255,255,255,.08);
            --border: rgba(255,255,255,.14);
            --ink: #e5edff;
            --text-secondary: #c9d6ff;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at 20% 20%, #2a1466 0, transparent 36%), radial-gradient(circle at 80% 70%, #10306b 0, transparent 34%), #070b1b;
            color: var(--ink); 
        }

        .top { 
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            color: var(--ink); 
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top i {
            color: var(--accent);
            margin-right: 8px;
        }

        .top div{
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top a { 
            color: var(--accent);
            text-decoration: none; 
            font-weight: 600;
            transition: color .3s ease;
        }

        .top a:hover {
            color: var(--ink);
        }

        .wrap { 
            max-width: 1100px; 
            margin: 32px auto; 
            padding: 0 20px; 
        }

        .hero { 
            background: linear-gradient(160deg, var(--surface), rgba(255,255,255,.03));
            border: 1px solid var(--border);
            color: var(--ink); 
            border-radius: 16px; 
            padding: 40px;
        }

        .hero h1 {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
        }

        .hero p {
            color: var(--text-secondary);
        }

        .stats { 
            display: grid; 
            grid-template-columns: repeat(4, minmax(0, 1fr)); 
            gap: 14px; 
            margin-top: 20px; 
        }

        .stat { 
            background: var(--surface);
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 16px; 
            text-align: center;
            transition: all .3s ease;
        }

        .stat:hover {
            border-color: var(--accent);
            background: linear-gradient(160deg, rgba(66, 198, 255, 0.08), rgba(139, 92, 246, 0.08));
        }

        .num { 
            font-size: 28px; 
            font-weight: 800; 
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat div:last-child {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
        }

        .recruiters { 
            background: var(--surface);
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 18px; 
            margin-top: 16px; 
        }

        .recruiters h3 {
            color: var(--accent);
            margin-bottom: 14px;
        }

        .pill { 
            display: inline-block; 
            margin: 6px 8px 0 0; 
            background: rgba(66, 198, 255, 0.15);
            color: var(--accent);
            padding: 7px 10px; 
            border-radius: 999px; 
            font-size: 13px;
            border: 1px solid var(--border);
        }

        @media (max-width: 900px) { 
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } 
        }
    </style>
  <link rel="stylesheet" href="assets/innosphere-theme.css">
</head>
<body>
    <div class="top">
        <div><i class="fas fa-briefcase"></i> Placements</div>
        <a href="index.html">Back To Home</a>
    </div>
    <div class="wrap">
        <section class="hero">
            <h1>Placement Highlights</h1>
            <p>Strong recruiter network, training support, and successful student outcomes.</p>
        </section>
        <section class="stats">
            <div class="stat"><div class="num">500+</div><div>Companies Visited</div></div>
            <div class="stat"><div class="num">95%</div><div>Placement Rate</div></div>
            <div class="stat"><div class="num">18 LPA</div><div>Highest Package</div></div>
            <div class="stat"><div class="num">1200+</div><div>Students Placed</div></div>
        </section>
        <section class="recruiters">
            <h3>Top Recruiters</h3>
            <span class="pill">TCS</span><span class="pill">Accenture</span><span class="pill">Wipro</span><span class="pill">Infosys</span><span class="pill">Capgemini</span><span class="pill">Cognizant</span><span class="pill">Deloitte</span><span class="pill">Amazon</span><span class="pill">SAP</span>
        </section>
    </div>
</body>
</html>
