<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Innosphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f3ff 0%, #fef0ff 50%, #fff7ed 100%);
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9333ea;
            margin-bottom: 32px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #5b21b6;
        }

        .register-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .register-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #111827;
        }

        .register-header h1 span {
            background: linear-gradient(135deg, #5b21b6 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-header p {
            color: #6b7280;
            font-size: 16px;
        }

        .user-type-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background: #f8fafc;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .toggle-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #5b21b6 0%, #9333ea 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #5b21b6 0%, #9333ea 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
        }

        .register-footer {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-footer a {
            color: #9333ea;
            font-weight: 600;
            text-decoration: none;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111827;
        }

        .modal-header p {
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 32px 24px;
                margin: 20px;
            }

            .register-header h1 {
                font-size: 28px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .user-type-toggle {
                flex-direction: column;
            }
        }
    </style>
  <link rel="stylesheet" href="assets/innosphere-theme.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="register-header">
                <h1>Create Account</h1>
                <p>Join Innosphere and start learning today</p>
            </div>

            <div class="user-type-toggle">
                <button class="toggle-btn active" onclick="switchUserType('student')">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button class="toggle-btn" onclick="switchUserType('faculty')">
                    <i class="fas fa-chalkboard-user"></i> Faculty
                </button>
            </div>

            <!-- Student Registration Form -->
            <form id="studentForm" class="form-section active" onsubmit="handleStudentRegister(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="studentName" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" id="studentId" required placeholder="STU-123456">
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="studentEmail" required placeholder="john@example.com">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="studentDept" required placeholder="Computer Science">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="studentPassword" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 8px;">Register as Student</button>
            </form>

            <!-- Faculty Registration Form -->
            <form id="facultyForm" class="form-section" onsubmit="handleFacultyRegister(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="facultyName" required placeholder="Dr. Jane Smith">
                    </div>
                    <div class="form-group">
                        <label>Faculty ID</label>
                        <input type="text" id="facultyId" required placeholder="FAC-123456">
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="facultyEmail" required placeholder="jane@example.com">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="facultySubject" required placeholder="Mathematics">
                    </div>
                    <div class="form-group">
                        <label>Qualification</label>
                        <input type="text" id="facultyQual" required placeholder="Ph.D.">
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="facultyPassword" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 8px;">Register as Faculty</button>
            </form>

            <div class="register-footer">
                Already have an account? <a href="javascript:openLoginModal('student')">Sign in</a>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-overlay" onclick="closeLoginModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeLoginModal()">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="modal-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue your learning</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function switchUserType(type) {
            // Update toggle buttons
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.toggle-btn').classList.add('active');

            // Update forms
            document.getElementById('studentForm').classList.remove('active');
            document.getElementById('facultyForm').classList.remove('active');

            if (type === 'student') {
                document.getElementById('studentForm').classList.add('active');
                document.querySelectorAll('.toggle-btn')[0].classList.add('active');
            } else {
                document.getElementById('facultyForm').classList.add('active');
                document.querySelectorAll('.toggle-btn')[1].classList.add('active');
            }
        }

        async function handleStudentRegister(event) {
            event.preventDefault();

            const data = {
                fullName: document.getElementById('studentName').value,
                email: document.getElementById('studentEmail').value,
                password: document.getElementById('studentPassword').value,
                studentId: document.getElementById('studentId').value,
                department: document.getElementById('studentDept').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/auth/register-student', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('userType', 'student');
                    localStorage.setItem('user', JSON.stringify(result.user));
                    alert('Registration successful!');
                    window.location.href = 'dashboard-student.html';
                } else {
                    alert(result.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error registering. Please try again.');
            }
        }

        async function handleFacultyRegister(event) {
            event.preventDefault();

            const data = {
                fullName: document.getElementById('facultyName').value,
                email: document.getElementById('facultyEmail').value,
                password: document.getElementById('facultyPassword').value,
                facultyId: document.getElementById('facultyId').value,
                subject: document.getElementById('facultySubject').value,
                qualification: document.getElementById('facultyQual').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/auth/register-faculty', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('userType', 'faculty');
                    localStorage.setItem('user', JSON.stringify(result.user));
                    alert('Registration successful!');
                    window.location.href = 'dashboard-faculty.html';
                } else {
                    alert(result.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error registering. Please try again.');
            }
        }
    </script>
</body>
</html>
